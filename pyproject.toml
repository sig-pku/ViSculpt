[project]
name = "visculpt"
version = "1.0.0"
description = "Visual-centric agentic geometry editing for Blender"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7,<1",
    "fastapi>=0.116,<1",
    "gradio-client>=2.6,<3",
    "langchain-core>=1.5.2",
    "langgraph>=1.2.10",
    "langgraph-cli[inmem]>=0.4,<1",
    "matplotlib>=3.11,<4",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "svgelements>=1.9,<2",
    "tomlkit>=0.13,<1",
]

[project.scripts]
visculpt = "visculpt:main"

[tool.uv.build-backend]
module-name = "visculpt"
source-exclude = [".DS_Store"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
